name: Release

# Tag vYYYY.M.patch (or vYYYY.M.patchbN for a beta). The integration's manifest
# version must equal the tag, and a stable tag needs a passing hardware gate.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write # keyless Cosign signing

env:
  OWNER: ${{ github.repository_owner }}

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python scripts/check_versions.py "${{ github.ref_name }}"
      - run: python scripts/check_hardware_gate.py "${{ github.ref_name }}"

  ci:
    needs: gates
    uses: ./.github/workflows/ci.yml

  image:
    name: Image ${{ matrix.arch }}
    needs: ci
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { arch: amd64, platform: linux/amd64, runner: ubuntu-latest }
          - { arch: aarch64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: app/dashcam_sync
          platforms: ${{ matrix.platform }}
          push: true
          provenance: true
          sbom: true # attached to the image
          tags: ghcr.io/${{ env.OWNER }}/dashcam-sync-app-${{ matrix.arch }}:${{ steps.v.outputs.version }}
      - name: Sign the image
        run: cosign sign --yes "ghcr.io/${OWNER}/dashcam-sync-app-${{ matrix.arch }}@${{ steps.build.outputs.digest }}"

  manifest:
    name: Multi-arch manifest
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - name: Publish and sign
        run: |
          v="${{ needs.image.outputs.version }}"
          docker buildx imagetools create -t "ghcr.io/${OWNER}/dashcam-sync-app:${v}" \
            "ghcr.io/${OWNER}/dashcam-sync-app-amd64:${v}" "ghcr.io/${OWNER}/dashcam-sync-app-aarch64:${v}"
          digest="$(docker buildx imagetools inspect "ghcr.io/${OWNER}/dashcam-sync-app:${v}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          cosign sign --yes "ghcr.io/${OWNER}/dashcam-sync-app@${digest}"

  github-release:
    needs: manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Zip the integration
        run: cd integration/custom_components/dashcam_sync && zip -r ../../../dashcam_sync.zip .
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'b') }}
          files: dashcam_sync.zip

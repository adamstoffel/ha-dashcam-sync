name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: Known vulnerabilities in the app's pinned dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pip-audit
      - run: pip-audit --require-hashes -r app/dashcam_sync/requirements.txt

  image-scan:
    # Informational: most findings are in the Home Assistant base image's own Go binaries,
    # which this project cannot patch; each rebuild picks up the base image's fixes. The project's
    # own Python dependencies are gated by the pip-audit job above.
    name: Trivy report for the app image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: app/dashcam_sync
          load: true
          push: false
          tags: dashcam-sync-app:scan
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: dashcam-sync-app:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          vuln-type: os,library

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

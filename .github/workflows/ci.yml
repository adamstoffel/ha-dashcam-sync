name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: "Called by the release workflow: never cancelled by a later push"
        type: boolean
        default: false

# A newer push cancels the CI of an older one on the same ref. A release's CI (called
# with release: true) runs on main's ref too, so it gets its own group and is never
# cancelled: a merge landing meanwhile must not stop a release half way.
concurrency:
  group: ci-${{ inputs.release && 'release-' || '' }}${{ github.ref }}
  cancel-in-progress: ${{ !inputs.release }}

permissions:
  contents: read

jobs:
  app:
    name: App (ruff, mypy --strict, pytest, 90% coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/pyproject.toml
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -e "app[dev]"
      - name: Lint
        working-directory: app
        run: |
          ruff check .
          ruff format --check .
      - name: Types
        working-directory: app
        run: mypy
      - name: Tests
        working-directory: app
        run: pytest --cov

  integration:
    name: Integration (ruff, pytest, 95% coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: integration/requirements_test.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libturbojpeg0
      - run: pip install -r integration/requirements_test.txt PyTurboJPEG av numpy
      - name: Lint
        working-directory: integration
        # The integration's code is at the repository root (custom_components/), where
        # HACS installs it from; its tests and tool settings live here.
        run: |
          ruff check --config pyproject.toml . ../custom_components
          ruff format --check --config pyproject.toml . ../custom_components
      - name: Types (mypy --strict)
        working-directory: integration
        run: pip install mypy && mypy
      - name: Tests
        working-directory: integration
        run: pytest --cov

  e2e:
    name: End to end (fake camera, real app, real integration in Home Assistant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: integration/requirements_test.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libturbojpeg0 ffmpeg
      - run: pip install -r integration/requirements_test.txt PyTurboJPEG av numpy pytest-timeout -e app
      - working-directory: e2e
        run: pytest --timeout=120

  ui:
    name: Panel browser tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -e app
      - run: npm install --no-save --no-package-lock playwright && npx playwright install --with-deps chromium
      - name: Drive the panel against a fake camera
        run: node e2e/ui/panel.cjs --screens ui-screens
        env:
          PYTHON: python
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: panel-screenshots
          path: ui-screens
          if-no-files-found: ignore

  docker:
    name: App image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: app/dashcam_sync/Dockerfile
          failure-threshold: error
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: app/dashcam_sync
          push: false
          load: true
          tags: dashcam-sync-app:ci
      - name: Smoke test the image
        run: docker run --rm --entrypoint python3 dashcam-sync-app:ci -c "import dashcam_sync, shutil; print(dashcam_sync.__version__, shutil.which('ffmpeg'))"

  catalog-checks:
    # One repository serves both: the Supervisor finds the app (app/dashcam_sync) through
    # the root repository.yaml, HACS installs the integration from custom_components/.
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
          # GitHub topics are a repository setting (Settings > General > Topics) that
          # only the owner can add. Remove this line once the repository has topics.
          ignore: topics

  ha-api:
    # The tests run on the newest Home Assistant test package CI can install, which can be
    # older than the minimum in hacs.json. A helper removed in between passes every test and
    # then stops the integration loading on a real install.
    name: Integration imports exist in the minimum Home Assistant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python scripts/check_ha_api.py

  release-metadata:
    name: Versions agree, scripts work
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pytest
      - run: python scripts/check_versions.py
      - name: Release scripts
        run: pytest scripts -q

name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please attach the **diagnostics download** (Settings › Devices & services › Dashcam Sync › ⋮ › Download diagnostics). It is redacted: SSIDs, passphrases, tokens and IP addresses are removed.
  - type: input
    id: versions
    attributes:
      label: App and integration version
      placeholder: "2026.11.0 / 2026.11.0"
    validations: { required: true }
  - type: input
    id: camera
    attributes:
      label: Camera model and the driver the app detected
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Relevant lines from the app's Logs page
      render: text
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Drag the downloaded diagnostics file here.

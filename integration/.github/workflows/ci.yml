# Active after `scripts/split_repos.sh` (the integration repository's own CI).
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libturbojpeg0
      - run: pip install -r requirements_test.txt PyTurboJPEG av numpy
      - run: ruff check . && ruff format --check . && pip install mypy && mypy && pytest --cov
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
      - uses: hacs/action@main
        with: { category: integration }

configuration:
  log_level:
    name: Log level
    description: How much the app writes to its log. Changing this restarts the app.
  api_token:
    name: Integration token (optional)
    description: >-
      Only needed to add the integration by hand when discovery does not appear. Leave it empty
      to use a generated token that is handed to Home Assistant automatically. If you set one
      (at least 32 characters), enter the same value in the integration, then restart the app.
  cameras:
    name: Cameras
    description: >-
      One entry per dashcam. Easier to add and edit in the Dashcam Sync panel (Cameras › Add camera),
      which lists your Wi-Fi interfaces and fills in the addresses.
    fields:
      id:
        name: ID
        description: Stable key for folders, devices and entity IDs (lower-case letters, digits, underscore).
      name:
        name: Name
        description: Display name, for example Polestar 2.
      connection:
        name: Connection
        description: hotspot = Camera hotspot (the camera runs its own Wi-Fi), lan = Local network (the camera is a client on your LAN).
      interface:
        name: Wi-Fi interface
        description: The Home Assistant Wi-Fi interface that joins the camera hotspot, as shown under Settings › System › Network (for example wlp4s0).
      ssid:
        name: Camera SSID
        description: The name of the camera's hotspot.
      wifi_password:
        name: Camera Wi-Fi password
        description: The hotspot passphrase. It is masked here and only shared with the integration.
      ipv4:
        name: IPv4 method
        description: >-
          static (default): Home Assistant takes a fixed address next to the camera, checked against
          your home network. auto skips the check, for an interface you set up yourself with DHCP.
      addressing:
        name: Address shape
        description: >-
          auto (default) uses a small block of four addresses around the camera and, when an address
          in it is taken on your home network, point-to-point instead. block always uses the small
          block. point_to_point claims only two addresses (Home Assistant's /32 and the camera's,
          reached through a direct route).
      static_address:
        name: Home Assistant address on the camera network
        description: >-
          Leave empty to let the app pick. With a prefix length, for example 192.168.1.253/30 for a
          block or 192.168.1.250/32 for point-to-point. In auto, the app fills this in and changes
          it only when the address it picked becomes taken.
      host:
        name: Camera address
        description: Camera IP or hostname. Leave empty to detect it.
      driver:
        name: Driver
        description: Force a driver, or leave on auto to detect the camera family.
      enabled:
        name: Enabled
        description: Pause one camera without deleting it.
      sync_mode:
        name: Sync mode
        description: Override the default sync mode for this camera.
  storage:
    name: Storage
    description: Where clips are kept. Easier to edit in the Dashcam Sync panel (Settings › Storage), which lists attached disks and shares and can move existing clips.
    fields:
      target:
        name: Keep clips on
        description: local = this Home Assistant (/media), network = a disk or share added under Settings › System › Storage, both = this Home Assistant and a copy on the disk or share.
      local_folder:
        name: Local folder
        description: Folder created under /media.
      network_folder:
        name: Network share or disk name
        description: >-
          The name of the network share or local disk (USB drive, SD card) you added under
          Settings > System > Storage, for example nas_dashcam or dashcam_disk.
      spool_when_network_down:
        name: Keep clips locally while the disk or share is offline
        description: New clips wait on this Home Assistant and move over when it is back.
      keep_original:
        name: Keep original .ts files
        description: Keep the camera's original file next to the remuxed .mp4 (useful as evidence).
  retention:
    name: Retention
    description: Rolling expiration. 0 days = no age limit, 0 GB = no cap. The network_ rules apply to the disk or share. Easier to edit in the Dashcam Sync panel (Settings › Retention).
    fields:
      normal_days:
        name: Normal clips (days)
        description: Delete normal clips older than this.
      event_days:
        name: Event clips (days)
        description: 0 keeps events until space is needed.
      parking_days:
        name: Parking clips (days)
        description: Delete parking clips older than this.
      photo_days:
        name: Photos (days)
        description: Delete photos older than this.
      max_total_gb:
        name: Size cap (GB)
        description: Delete oldest first until under the cap.
      min_free_percent:
        name: Minimum free space (%)
        description: Delete oldest first until free space recovers, and refuse to write below it.
      network_normal_days:
        name: Normal clips on the disk or share (days)
        description: Same as above, for the disk or share.
      network_event_days:
        name: Event clips on the disk or share (days)
        description: Same as above, for the disk or share.
      network_parking_days:
        name: Parking clips on the disk or share (days)
        description: Same as above, for the disk or share.
      network_photo_days:
        name: Photos on the disk or share (days)
        description: Same as above, for the disk or share.
      network_max_total_gb:
        name: Size cap on the disk or share (GB)
        description: 0 means no cap.
      network_min_free_percent:
        name: Minimum free space on the disk or share (%)
        description: Same as above, for the disk or share.
      purge_time:
        name: Daily purge time
        description: Local time (HH:MM) of the daily retention run.
  sync:
    name: Sync
    description: What to download and what happens afterwards. Easier to edit in the Dashcam Sync panel (Settings › Sync).
    fields:
      mode:
        name: Mode
        description: events_only = Events only (event and parking clips), events_first = Events first (those, then the recent minutes), everything = Everything on the card.
      recent_minutes:
        name: Recent window (minutes)
        description: Always grab normal clips from the last N minutes before arrival.
      delete_from_camera:
        name: Delete from camera
        description: Delete verified clips from the SD card. Off by default.
      delete_events_from_camera:
        name: Also delete event clips
        description: Event clips are only deleted from the camera when this is also on.
      remux_to_mp4:
        name: Convert to MP4
        description: Lossless remux of .ts to .mp4 so clips play in browsers and the Home Assistant app.
      thumbnails:
        name: Thumbnails
        description: Create a 320 px thumbnail for each clip.
network:
  8100/tcp: Integration API (internal network only)
